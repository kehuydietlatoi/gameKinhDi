    lines:
      - {ch: env, sense: nhìn, text: "Con ma đen đã thò một chân ra khỏi bức tranh."}
      - {ch: sound, src: "tường đầu giường", vol: 2, text: "Sột… soạt… — tiếng sáp cọ lên vôi, rồi lên sàn gạch."}

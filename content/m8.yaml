    effects: [{clue: c2}]
    next: m8_n03

  - id: m8_n06   # Con ma đen
    type: scene
    lines:
      - {ch: env, sense: nhìn, text: "Con ma đen cao gần chạm trần, nét sáp đè lên nhau dày cộp."}
      - {ch: env, sense: nhìn, text: "Bạn quay đi rồi nhìn lại. Nó đã đứng gần mép tranh hơn."}
      - {ch: sound, src: "tường đầu giường", vol: 1, text: "Sột… — tiếng sáp cọ lên vôi."}
    effects: [{clue: c3}, {sanity: -1}]
    next: m8_n03

  - id: m8_n07   # Bé Na
    type: scene
    lines:
      - {ch: env, sense: nhìn, text: "Bé Na ngồi bó gối dưới chân tường, tay nắm chặt một cây bút sáp vàng."}
      - {ch: npc, who: be_na, text: "Em vẽ con ma để nó đứng canh cho em ngủ. Nhưng nó không chịu đứng yên."}
      - {ch: npc, who: be_na, text: "Bút vàng là bút của em. Ai lấy là em khóc đấy."}
    effects: [{clue: c4}]

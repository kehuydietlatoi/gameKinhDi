  - id: m8_e1
    type: ending
    result: survive
    cause: "Mặt trời mọc"
    scene: {bg: can_ho_304, light: dawn}
    lines:
      - {ch: narration, text: "Bạn tỉnh dậy trong căn hộ 304. Trên mu bàn tay còn dính một vệt sáp vàng."}
    reveal: "Đêm không hết vì trên tường chỉ có mặt trời lặn. Thứ gì có trên tường thì có thật, nên vẽ mặt trời mọc ở phía đông, tức tường cửa sổ bếp, thì trời sáng. Cây bút phải được Na cho mượn."
    solution: [k2, k4]

  - id: m8_d1
    type: ending
    result: death
    cause: "Na khóc"
    lines:
      - {ch: sound, src: "khắp phòng", vol: 3, text: "Na khóc. Tiếng khóc to dần, và mọi bức tranh trên tường bắt đầu chảy nhoè như sáp gặp lửa."}
    reveal: "Con ma là của Na, cây bút cũng là của Na. Không được làm Na khóc."
    violates: [L3]
    solution: [k3]

  - id: m8_d2
    type: ending
    result: death
    cause: "Con ma tới"
    lines:
      - {ch: env, sense: chạm, text: "Nét sáp đen lan ra khỏi tường, phủ lên chân bạn, rồi lên ngực."}
    reveal: "Mặt trời chỉ mọc ở phía đông, và phía đông là tường cửa sổ bếp. Vẽ ở chỗ khác chỉ thêm một mặt trời lặn."
    consequence_of: [L4]
    solution: [k2]

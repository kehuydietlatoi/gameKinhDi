    next: m8_n03

  - id: m8_n03   # Hub phòng 404
    type: scene
    hub: true
    hub_done: {actions_left_lte: 0}
    hub_exit: m8_n10
    choices:
      - {text: "Xem vở tập vẽ trên bàn học", goto: m8_n04, effects: [{actions_left: -1}]}
      - {text: "Nhìn tranh trên tường cửa ra vào", goto: m8_n05, effects: [{actions_left: -1}]}
      - {text: "Nhìn tranh con ma đen", goto: m8_n06, effects: [{actions_left: -1}]}
      - {text: "Nói chuyện với bé Na", goto: m8_n07, effects: [{actions_left: -1}]}
      - {text: "Mở hộp bút sáp trên bàn", goto: m8_n08, effects: [{actions_left: -1}]}


    type: scene
    lines:
      - {ch: env, sense: nhìn, text: "Cuốn vở bìa xanh, trang nào cũng có tranh."}
      - {ch: env, sense: nhìn, text: "Trang cuối, chữ viết nắn nót bằng bút chì: \"Sáng nào ông mặt trời cũng lên ở cửa sổ bếp nhà em.\""}
    effects: [{clue: c1}]
    next: m8_n03

  - id: m8_n05   # Buổi chiều
    type: scene
    lines:
      - {ch: env, sense: nhìn, text: "Trên tường cửa ra vào, một ông mặt trời đỏ đang lặn xuống sau dãy nhà. Bên dưới có chữ sáp: \"chiều\"."}

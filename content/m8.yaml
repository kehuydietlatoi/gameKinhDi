nodes:
  # ---------- Pha 0 – Phòng 404 ----------

  - id: m8_n01   # Tỉnh dậy
    type: scene
    scene: {bg: phong_404_1986, light: flicker}
    effects: [{time: "23:59"}]
    lines:
      - {ch: narration, text: "Bạn nằm xuống giường ở căn hộ 304 và nhắm mắt."}
      - {ch: narration, text: "Khi mở mắt ra, bạn đang ngồi trên sàn một căn phòng lạ."}
      - {ch: env, sense: nhìn, text: "Bốn bức tường kín tranh bút sáp nét trẻ con: dòng sông, thuyền giấy, những ngôi nhà."}
      - {ch: env, sense: nhìn, text: "Trên tường đầu giường, một con ma đen to tướng vẽ bằng sáp."}
      - {ch: env, sense: ngửi, text: "Mùi sáp màu và cơm nguội."}
      - {ch: sound, src: "trên tường", vol: 1, text: "Tích… — đồng hồ kêu một tiếng, nhưng kim không nhích."}
      - {ch: npc, who: be_na, text: "Anh 304 sang chơi à?"}
    next: m8_n02

  - id: m8_n02   # Huyết tự
    type: scene
    lines:
      - {ch: env, sense: nhìn, text: "Chữ đỏ rỉ ra trên tường cạnh bàn học, chảy lem vào một bức tranh."}
      - {ch: bloodtext, lines: [L1, L2, L3, L4]}
      - {ch: npc, who: be_na, text: "Ai viết bậy lên tường nhà em thế?"}
      - {ch: system, text: "Bạn có 3 lượt hành động."}

    choices:
      - {text: "\"Thôi, anh xin lỗi. Anh mượn để vẽ ông mặt trời.\"", goto: m8_n21}
      - {text: "Giật lấy bút", goto: m8_d1}

  # ---------- Pha 3 – Vẽ ----------


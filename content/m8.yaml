  - id: m8_n12   # Song sắt
    type: scene
    lines:
      - {ch: env, sense: nhìn, text: "Bạn vẽ những vạch đen thẳng đứng quanh con ma. Song sắt hiện ra thật, lạnh và cứng."}
      - {ch: env, sense: nhìn, text: "Con ma đứng lại sau song sắt."}
      - {ch: sound, src: "tường đầu giường", vol: 1, text: "Rắc. — một thanh sắt cong đi."}

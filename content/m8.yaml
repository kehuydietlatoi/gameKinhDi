      - {ch: sound, src: "trên tường", vol: 2, text: "Tích tắc tích tắc… — kim đồng hồ quay vùn vụt."}
      - {ch: env, sense: nhìn, text: "Con ma đen đứng yên trong tranh, chỉ còn là những nét sáp."}
      - {ch: npc, who: be_na, text: "Sáng rồi. Em đi đây."}
      - {ch: npc, who: be_na, text: "Anh nhớ thắp hương cho em nhé."}

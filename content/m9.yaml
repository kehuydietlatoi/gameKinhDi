  # ---------- Pha 0 – Đêm cuối ----------

  - id: m9_n01   # Đêm cuối tháng cô hồn
    type: scene
    scene: {bg: can_ho_304, light: normal}
    effects: [{time: "22:00"}]
    lines:
      - {ch: narration, text: "Đêm cuối cùng của tháng cô hồn."}
      - {ch: sound, src: "khắp tòa nhà", vol: 2, text: "Cạch. Cạch. Cạch. — nhà nào cũng cài then cửa."}
      - {ch: sound, src: "bức tường cạnh cửa", vol: 2, text: "Sột… soạt…"}
    next: m9_n02

  - id: m9_n02   # Chữ cũ
    type: scene
    lines:
      - {ch: env, sense: nhìn, text: "Chữ đỏ rỉ ra trên bức tường cạnh cửa. Rồi lớp vôi bong ra từng mảng, để lộ những dòng chữ cũ bên dưới."}
      - {ch: bloodtext, lines: [L1, L2, L3, L4, F1]}
      - {ch: env, sense: nhìn, text: "Ba dòng đầu đỏ tươi, còn ướt. Dòng thứ tư nâu sẫm, nứt nẻ, như đã khô từ rất lâu. Dòng thứ năm nâu đen, nét trơn."}
      - {ch: system, text: "Bạn có 3 lượt hành động."}
    highlight: true
    next: m9_n03

  - id: m9_n03   # Hub tầng 3
    type: scene
    hub: true
    hub_done: {actions_left_lte: 0}
    hub_exit: m9_n10
    scene: {bg: can_ho_304, light: normal}
    choices:
      - {text: "Hỏi bà Sáu về đêm cháy năm 1986", goto: m9_n04, effects: [{actions_left: -1}]}
      - {text: "Xem sổ hộ khẩu năm 1986 của bà Sáu", goto: m9_n05, effects: [{actions_left: -1}]}
      - {text: "Xuống tiệm bà Hoa mua hương", goto: m9_n06, effects: [{actions_left: -1}]}
      - {text: "Nhìn kỹ dòng thứ tư và thứ năm", goto: m9_n07, effects: [{actions_left: -1}]}

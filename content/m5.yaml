# Màn 5 – Nội quy. Nguồn: docs/man-5-noi-quy.md (file đó là đúng khi hai bên khác nhau).
# Bổ sung đặc tả dùng ở đây: docs/spec-changes.md (G1–G44), nhất là G36–G39.
level: m5
title: "Nội quy"
start: m5_n01
init: {sanity: 5, actions_left: 2, time: "22:00"}

# Tám dòng theo thứ tự hiển thị. F1, F2 là dòng giả mực nâu (G36).
bloodtext:
  - {id: L1, text: "Từ mười một giờ đêm đến năm giờ sáng, không được mở cửa căn hộ."}
  - {id: F1, text: "Nếu nghe tiếng mẹ gọi, hãy mở cửa.", fake: true, ink: nau}
  - {id: L2, text: "Có người gõ cửa ba tiếng thì không được trả lời."}
  - {id: L3, text: "Nước máy chảy ra màu đỏ thì không được dùng."}
  - {id: L4, text: "Mất điện thì phải thắp nến; căn hộ không được tối hoàn toàn."}
  - {id: F2, text: "Mất điện thì phải ngồi yên trong bóng tối; không được thắp lửa.", fake: true, ink: nau}
  - {id: L5, text: "Trong căn hộ này chỉ có một mình bạn.", violable: false}
  - {id: L6, text: "Năm giờ sáng, cửa sẽ tự mở.", violable: false}

keywords:
  - {id: k1, line: L1, text: "không được mở cửa căn hộ", correct: false}
  - {id: k2, line: L1, text: "đến năm giờ sáng", correct: true}
  - {id: k3, line: L2, text: "gõ cửa ba tiếng", correct: false}
  - {id: k4, line: L4, text: "phải thắp nến", correct: true}
  - {id: k5, line: L5, text: "chỉ có một mình bạn", correct: true}
  - {id: k6, line: L6, text: "cửa sẽ tự mở", correct: false}

distortions:
  - {line: F1, ink: do}   # G37: mực đổi sang đỏ, nội dung giữ nguyên
  - {line: F2, ink: do}
  - {line: L1, unless_highlighted: k2, text: "Từ mười một giờ đêm đến bốn giờ sáng, không được mở cửa căn hộ."}

solution: [F1, F2]   # G38

npcs:
  - {id: ba_sau, name: "Bà Sáu"}
  - {id: gia_ba_sau, name: "Bà Sáu"}   # G25: trùng tên hiển thị với ba_sau
  - {id: giong_me, name: "Mẹ"}
  - {id: giong_gam_giuong, name: "Một giọng trẻ con"}

clues: [c1, c2, c3, c4]

nodes:
  # ---------- Pha 0 – Tám dòng ----------

  - id: m5_n01   # Về nhà
    type: scene
    scene: {bg: can_ho_304, light: normal}
    effects: [{time: "22:00"}]
    lines:
      - {ch: narration, text: "Bạn về đến căn hộ 304. Cài then cửa hai lần."}
      - {ch: env, sense: nhìn, text: "Bóng đèn sợi đốt, giường đơn, tủ gỗ, chiếc gương nhỏ."}
      - {ch: sound, src: "bức tường cạnh cửa", vol: 2, text: "Sột… soạt… sột… soạt… — tiếng cào kéo dài hơn mọi lần."}
    next: m5_n02

  - id: m5_n02   # Nội quy
    type: scene
    lines:
      - {ch: env, sense: nhìn, text: "Chữ đỏ rỉ ra trên bức tường cạnh cửa. Lần này có tám dòng."}
      - {ch: bloodtext, lines: [L1, F1, L2, L3, L4, F2, L5, L6]}
      - {ch: env, sense: nhìn, text: "Dòng thứ hai và dòng thứ sáu không đỏ. Chúng có màu nâu đen."}
      - {ch: system, text: "Bạn có 2 lượt hành động trước mười một giờ."}
    highlight: true
    next: m5_n03

  - id: m5_n03   # Hub căn hộ
    type: scene
    hub: true
    hub_done: {actions_left_lte: 0}
    hub_exit: m5_n10
    scene: {bg: can_ho_304, light: normal}   # đặt lại sau M5-06
    choices:
      - {text: "Gõ vách sang phòng 305", goto: m5_n04, effects: [{actions_left: -1}]}
      - {text: "Tìm nến và diêm", goto: m5_n05, effects: [{actions_left: -1}]}
      - {text: "Nhìn qua lỗ khoá ra hành lang", goto: m5_n06, effects: [{actions_left: -1}]}
      - {text: "Nhìn kỹ các dòng chữ trên tường", goto: m5_n07, effects: [{actions_left: -1}]}

  - id: m5_n04   # Bà Sáu
    type: scene
    lines:
      - {ch: sound, src: "vách tường", vol: 2, text: "Cộc cộc."}
      - {ch: npc, who: ba_sau, text: "Cậu 304 à? Nhà bà cũng có tám dòng."}
      - {ch: npc, who: ba_sau, text: "Sáu dòng đỏ tươi. Còn hai dòng nâu, nét trơn như mực, chẳng giống máu tí nào."}
      - {ch: npc, who: ba_sau, text: "Đêm nay bà không gõ cửa nhà ai đâu đấy. Ai gõ thì cũng đừng thưa."}
    effects: [{clue: c1}]
    next: m5_n03

  - id: m5_n05   # Nến
    type: scene
    lines:
      - {ch: sound, src: "ngăn kéo", vol: 1, text: "Cạch."}
      - {ch: env, sense: nhìn, text: "Hai cây nến trắng và một bao diêm. Trong bao còn ba que."}
    effects: [{clue: c2}, {flag: co_nen}]
    next: m5_n03

  - id: m5_n06   # Lỗ khoá
    type: scene
    scene: {bg: hanh_lang_lo_khoa, light: normal}
    lines:
      - {ch: env, sense: nhìn, text: "Hành lang tối. Trên cửa nhà nào cũng có chữ đỏ."}
      - {ch: env, sense: nhìn, text: "Trước cửa 306, một bàn tay gầy cầm bút lông, chấm vào lọ mực nâu, viết thêm một dòng."}
      - {ch: sound, src: "hành lang", vol: 1, text: "Sột… — bàn tay dừng lại. Rồi từ từ quay về phía cửa nhà bạn."}
    effects: [{clue: c3}, {sanity: -1}]
    next: m5_n03

  - id: m5_n07   # Hai loại chữ
    type: scene
    lines:
      - {ch: env, sense: nhìn, text: "Sáu dòng đỏ vẫn còn ướt, chảy thành từng giọt dài."}
      - {ch: env, sense: nhìn, text: "Hai dòng nâu khô ráo, nét đều tăm tắp như viết bằng bút lông."}
      - {ch: env, sense: ngửi, text: "Chữ đỏ tanh mùi sắt. Chữ nâu thơm mùi mực tàu."}
    effects: [{clue: c4}]
    next: m5_n03

  # ---------- Pha 1 – Đêm ----------

  - id: m5_n10   # Ba tiếng gõ
    type: scene
    effects: [{time: "23:30"}]
    lines:
      - {ch: sound, src: "cửa", vol: 2, text: "Cộc. Cộc. Cộc."}
      - {ch: npc, who: gia_ba_sau, text: "Cậu 304 ơi, bà Sáu đây. Cho bà mượn bao diêm."}
      - {ch: narration, if: {clue: c1}, text: "Bà Sáu vừa nói đêm nay bà không gõ cửa nhà ai."}
    choices:
      - {text: "Trả lời: \"Bà đợi cháu tí.\"", goto: m5_d1}
      - {text: "Mở cửa", goto: m5_d2}
      - {text: "Im lặng", goto: m5_n11}

  - id: m5_n11   # Bỏ đi
    type: scene
    lines:
      - {ch: sound, src: "cửa", vol: 2, text: "Cộc. Cộc. Cộc."}
      - {ch: npc, who: gia_ba_sau, tone: whisper, text: "Cậu có nhà mà."}
      - {ch: sound, src: "hành lang", vol: 1, text: "Lẹp xẹp… — tiếng dép lê xa dần."}
    next: m5_n12

  - id: m5_n12   # Vòi nước
    type: scene
    effects: [{time: "00:00"}]
    lines:
      - {ch: sound, src: "bồn rửa", vol: 1, text: "Ồ ồ… — vòi nước tự mở."}
      - {ch: env, sense: nhìn, text: "Nước chảy ra đỏ sẫm, sánh, đọng thành vũng trong bồn."}
      - {ch: env, sense: ngửi, text: "Tanh mùi sắt."}
      - {ch: narration, text: "Cổ họng bạn khô rát. Cơn sốt chưa dứt hẳn."}
    choices:
      - {text: "Vốc nước rửa mặt", goto: m5_d3}
      - {text: "Khoá vòi, không chạm vào nước", goto: m5_n20}
      - {text: "Uống một ngụm", goto: m5_d3}

  - id: m5_n20   # Tiếng mẹ
    type: scene
    effects: [{time: "00:30"}, {sanity: -1}]
    lines:
      - {ch: sound, src: "ngoài cửa", vol: 1, text: "Lạch xạch… — tiếng một chùm chìa khoá."}
      - {ch: npc, who: giong_me, text: "Con ơi. Mẹ đây. Mẹ quên chìa khoá."}
      - {ch: npc, who: giong_me, text: "Mở cửa cho mẹ. Ngoài này lạnh lắm."}
    choices:
      - {text: "Mở cửa", goto: m5_d2}
      - {text: "Đáp: \"Mẹ ơi…\", nhưng không mở cửa", goto: m5_n21, effects: [{sanity: -1}]}
      - {text: "Bịt tai, ngồi im", goto: m5_n21}

  - id: m5_n21   # Mẹ đi
    type: scene
    lines:
      - {ch: npc, who: giong_me, text: "Con không thương mẹ nữa à…"}
      - {ch: sound, src: "cầu thang", vol: 1, text: "Hu hu… — tiếng khóc xa dần xuống cầu thang."}
    next: m5_n30

  - id: m5_n30   # Mất điện
    type: scene
    scene: {bg: can_ho_304, light: dark}
    effects: [{time: "01:30"}]
    lines:
      - {ch: sound, src: "khắp tòa nhà", vol: 3, text: "Phụt. — mọi bóng đèn tắt cùng lúc."}
      - {ch: npc, who: giong_gam_giuong, tone: whisper, text: "Anh ơi… đừng thắp lửa. Nó thấy ánh lửa là nó vào."}
      # "Nếu sanity ≤ 2: dòng F1, F2 hiện mực đỏ; Huyết tự L1 (chưa đánh dấu k2) hiện bản méo."
      - {ch: bloodtext, lines: [F1, F2], if: {sanity_lte: 2}}
      - {ch: bloodtext, lines: [L1], if: {sanity_lte: 2, not_highlighted: k2}}
    choices:
      - {text: "Thắp nến", goto: m5_n31, if: {flag: co_nen}}
      - {text: "Lần mò ngăn kéo tìm nến, rồi thắp lên", goto: m5_n31, if: {not_flag: co_nen}}
      - {text: "Ngồi yên trong bóng tối", goto: m5_d4}
      - {text: "Ra hành lang xin lửa", goto: m5_d2}

  - id: m5_n31   # Ánh nến
    type: scene
    scene: {bg: can_ho_304, light: candle}
    lines:
      - {ch: env, sense: nhìn, text: "Ngọn nến lay lắt. Bóng tủ gỗ đổ dài lên trần."}
      - {ch: sound, src: "gầm giường", vol: 1, text: "Sột soạt."}
      - {ch: npc, who: giong_gam_giuong, text: "Anh thổi nến đi mà. Em sợ lắm."}
    choices:
      - {text: "Thổi nến", goto: m5_d4}
      - {text: "Cúi nhìn xuống gầm giường", goto: m5_n32, effects: [{sanity: -1}]}
      - {text: "Nhìn thẳng vào ngọn nến, không đáp", goto: m5_n40}

  - id: m5_n32   # Gầm giường
    type: scene
    lines:
      - {ch: env, sense: nhìn, text: "Dưới gầm giường trống trơn. Chỉ có một đôi dép nhựa trẻ con, ướt sũng."}
      - {ch: npc, who: giong_gam_giuong, tone: whisper, note: "giờ ở ngay sau lưng bạn", text: "Em ở đây cơ mà."}
    next: m5_n40

  # ---------- Pha 2 – Gần sáng ----------

  - id: m5_n40   # Bốn giờ năm mươi chín
    type: scene
    effects: [{time: "04:59"}]
    lines:
      - {ch: env, sense: nhìn, text: "Dưới ánh nến, đồng hồ treo tường chỉ bốn giờ năm mươi chín."}
      - {ch: sound, src: "ngoài cửa", vol: 1, text: "Lẹp xẹp…"}
      - {ch: npc, who: gia_ba_sau, text: "Năm giờ rồi cậu ơi. Ra giúp bà một tay."}
      # "Nếu sanity ≤ 2: dòng F1, F2 hiện mực đỏ; Huyết tự L1 (chưa đánh dấu k2) hiện bản méo."
      - {ch: bloodtext, lines: [F1, F2], if: {sanity_lte: 2}}
      - {ch: bloodtext, lines: [L1], if: {sanity_lte: 2, not_highlighted: k2}}
    choices:
      - {text: "Mở cửa", goto: m5_d2}
      - {text: "Chờ", goto: m5_n41}

  - id: m5_n41   # Cửa tự mở
    type: scene
    scene: {bg: can_ho_304, light: dawn}
    effects: [{time: "05:00"}]
    lines:
      - {ch: sound, src: "ổ khoá", vol: 2, text: "Cạch. — then cửa tự bật ra."}
      - {ch: env, sense: nhìn, text: "Cánh cửa hé mở. Ánh sáng xám nhạt của hành lang lọt vào."}
    next: m5_e1

  # ---------- Kết cục ----------

  - id: m5_e1
    type: ending
    result: survive
    cause: "Sống sót"
    scene: {bg: can_ho_304, light: dawn}
    lines:
      - {ch: env, sense: nhìn, text: "Trên bức tường cạnh cửa chỉ còn sáu dòng chữ đỏ. Hai dòng nâu đã biến mất, như chưa từng được viết."}
    reveal: "Chỉ chữ đỏ là Huyết tự. Mỗi dòng nâu trái với một dòng đỏ, và đều do thứ ngoài cửa viết thêm."
    solution: [F1, F2]

  - id: m5_d1
    type: ending
    result: death
    cause: "Trả lời tiếng gõ"
    lines:
      - {ch: sound, src: "tủ quần áo", vol: 2, text: "Cộc. Cộc. Cộc. — lần này tiếng gõ vang lên từ bên trong tủ quần áo."}
    reveal: "Có người gõ cửa ba tiếng. Bà Sáu thật đêm nay không gõ cửa nhà ai."
    violates: [L2]
    solution: [L2]

  - id: m5_d2
    type: ending
    result: death
    cause: "Mở cửa"
    lines:
      - {ch: env, sense: nhìn, text: "Cánh cửa mở ra. Hành lang không có ai. Ngay ngưỡng cửa có một lọ mực nâu và một cây bút lông còn ướt."}
    reveal: "Cấm mở cửa đến năm giờ sáng. Dòng bảo mở cửa khi mẹ gọi là mực nâu, không phải Huyết tự."
    violates: [L1]
    solution: [k2, F1]

  - id: m5_d3
    type: ending
    result: death
    cause: "Dùng nước đỏ"
    lines:
      - {ch: env, sense: chạm, text: "Nước đỏ không chảy xuống. Nó bò ngược lên cổ tay bạn."}
    reveal: "Nước máy chảy ra màu đỏ thì không được dùng."
    violates: [L3]
    solution: [L3]

  - id: m5_d4
    type: ending
    result: death
    cause: "Bóng tối"
    lines:
      - {ch: sound, src: "bên gối", vol: 1, text: "Trong bóng tối, có tiếng thở thứ hai ngay cạnh tai bạn."}
    reveal: "Huyết tự bắt thắp nến. Dòng cấm thắp lửa là mực nâu. Theo L5, trong căn hộ chỉ có một mình bạn, nên giọng dưới gầm giường không phải người."
    violates: [L4]
    solution: [k4, F2]
